<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>CMSN</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
        font-family: "Arial", sans-serif;
        color: white;
        user-select: none;
        touch-action: none;
      }

      /* --- CSS CHO PHẦN CÂU HỎI --- */
      .container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
        background: radial-gradient(circle, #2c001e 0%, #000000 100%);
        transition: opacity 1s ease;
        padding: 20px;
        box-sizing: border-box;
      }

      h1 {
        font-size: 2.5rem;
        color: #ff69b4;
        text-shadow: 0 0 10px #ff69b4;
        margin-bottom: 40px;
        text-align: center;
        pointer-events: none;
        line-height: 1.5;
      }

      .btn-group {
        position: relative;
        display: flex;
        justify-content: center;
        gap: 30px;
        width: 100%;
        flex-wrap: wrap;
      }

      button {
      padding: 15px 30px;
        font-size: 1.2rem;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-weight: bold;
        white-space: normal;
        max-width: 90%;
        z-index: 101;
        word-wrap: break-word;
        -webkit-tap-highlight-color: transparent;
      }

      .btn-pink {
        background-color: #ff3366;
        color: white;
        box-shadow: 0 0 15px #ff3366;
        transition: transform 0.2s;
      }

      .btn-pink:hover {
        transform: scale(1.1);
      }
      .btn-pink:active {
        transform: scale(0.95);
      }

      #btn-no {
        background-color: #555;
        color: #ccc;
        transition: top 0.1s ease-out, left 0.1s ease-out; /* Nút nhảy nhanh hơn chút */
      }

      input[type="text"] {
        padding: 15px;
        width: 80%;
        max-width: 400px;
        font-size: 1.2rem;
        border-radius: 10px;
        border: 2px solid #ff3366;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        outline: none;
        text-align: center;
      }
      .top-image {
        width: 200px;
        max-width: 60%;
        margin-bottom: 25px;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
      }
      .hidden {
        display: none !important;
      }

      /* --- CSS CHO CANVAS --- */
      canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      #final-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ff3366;
        font-size: 10rem;
        font-weight: bold;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s ease-in-out;
        text-shadow: 0 0 20px rgba(255, 51, 102, 0.8);
        font-family: "Brush Script MT", cursive;
        z-index: 10;
        width: 90%;
        text-align: center;
      }

      .show-text {
        opacity: 1 !important;
      }
      .heartbeat {
        animation: heartbeat 1.5s infinite;
      }
      #birthday-text {
        font-size: 3rem;
        font-weight: bold;
        color: #ff69b4;
        z-index: 10;
        margin-bottom: 20px;
        font-family: "Brush Script MT", cursive;
        white-space: nowrap;
        overflow: hidden;
        width: 100%;
        animation: marquee 10s linear infinite;
        text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
      }
      #heart-text {
        position: relative;
        width: 400px;
        height: 350px;
        margin: 0 auto 20px;
      }

      .heart-char {
        position: absolute;
        color: #ff69b4;
        font-size: 2.2rem;
        font-weight: bold;
        text-shadow: 0 0 15px rgba(255, 105, 180, 0.9);
        animation: floatChar 4s infinite ease-in-out;
      }
      #heart-3d {
        position: relative;
        width: 420px;
        height: 420px;
        margin: auto;
        transform-style: preserve-3d;
        perspective: 900px;
      }

      .heart-3d-char {
        position: absolute;
        top: 50%;
        left: 50%;

        font-family: "Poppins", "Segoe UI", sans-serif;
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: 1px;

        color: #ff2f92;

        padding: 4px 6px;
        border-radius: 6px;

        background: rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(2px);

        /* NEON GLOW nhiều lớp */
        text-shadow: 0 0 4px #ff2f92, 0 0 8px #ff2f92,
          0 0 16px rgba(255, 47, 146, 0.9), 0 0 32px rgba(255, 47, 146, 0.7),
          0 0 48px rgba(255, 47, 146, 0.5);

        box-shadow: 0 0 10px rgba(255, 47, 146, 0.6),
          0 0 20px rgba(255, 47, 146, 0.4);

        transform-style: preserve-3d;
        will-change: transform, filter;
        pointer-events: none;
        animation: neonPulse 2.5s ease-in-out infinite;
      }
      #heart-image {
        position: absolute;
        top: 65%;
        left: 50%;
        width: 130px;
        height: 130px;
        transform: translate(-50%, -50%) translateZ(80px);
        z-index: 10;

        overflow: hidden;

        clip-path: path(
          "M 90 30
     C 90 0, 0 0, 0 55
     C 0 90, 45 125, 90 160
     C 135 125, 180 90, 180 55
     C 180 0, 90 0, 90 30 Z"
        );

        box-shadow: 0 0 25px rgba(255, 47, 146, 0.7),
          0 0 50px rgba(255, 47, 146, 0.4);

        background: #000;
        pointer-events: none;
      }

      #heart-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      /* --- CSS CHO PHÁO HOA  --- */
      #fireworks-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 99;
        background: transparent;
      }

      @media (max-width: 768px) {
        #heart-3d {
          width: 260px;
          height: 260px;
        }

        #heart-image {
          width: 110px;
          height: 110px;
        }
      }
      @media (max-width: 370px) {
         h1 {
            font-size: 1.2rem; /* Chữ nhỏ hơn xíu nữa */
         }
         button {
            font-size: 0.85rem; /* Chữ nút nhỏ lại để vừa */
         }
         #heart-image {
            top: 58%; /* Tinh chỉnh nhẹ vị trí */
         }
      }
      @keyframes neonPulse {
        0%,
        100% {
          filter: brightness(1);
        }
        50% {
          filter: brightness(1.4);
        }
      }
      @keyframes floatChar {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.2);
          opacity: 1;
        }
      }

      @media (max-width: 768px) {
        #heart-text {
          width: 280px;
          height: 250px;
        }
        .heart-char {
          font-size: 1.4rem;
        }
      }
      @keyframes marquee {
        0% {
          transform: translateX(100%);
        }
        100% {
          transform: translateX(-100%);
        }
      }

      @media (max-width: 768px) {
        #birthday-text {
          font-size: 1.8rem;
        }
      }
      @keyframes heartbeat {
        0% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.1);
        }
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
      }
      @media (max-width: 768px) {
        .heart-3d-char {
          font-size: 1.6rem;
          text-shadow: 0 0 3px #ff2f92, 0 0 8px rgba(255, 47, 146, 0.9),
            0 0 16px rgba(255, 47, 146, 0.6);
        }
      }
      @media (max-width: 768px) {
        h1 {
          font-size: 1.5rem;
          margin-bottom: 20px;
        }
        button {
          padding: 12px 20px;
          font-size: 1rem;
        }
        #final-message {
          font-size: 3rem;
        }
        .btn-group {
          gap: 15px;
        }
      }
      @keyframes heartBeatImg {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.08);
        }
      }

      #heart-image {
        animation: heartBeatImg 2.5s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <audio id="bg-music" loop>
      <source src="nhacNen.mp3" type="audio/mpeg" />
    </audio>

    <audio id="sfx-jump">
      <source
        src="https://www.soundjay.com/buttons/sounds/button-16.mp3"
        type="audio/mpeg"
      />
    </audio>

    <div id="screen-1" class="container">
      //<img src="imgDau.PNG" class="top-image" alt="ảnh dễ thương" />
      <h1>Phương Anh có thấy Lâm đẹp trai khum? 😍</h1>
      <div class="btn-group">
        <button id="btn-no">Không! Phương Anh thấy xấu hoắc 🥹</button>
        <button id="btn-yes" class="btn-pink">
          Có! Phương Anh thấy Lâm đẹp trai nhất quả đất lunn 😘
        </button>
      </div>
    </div>

    <div id="screen-2" class="container hidden">
      <h1>
        Phương Anh có thực sự thấy Lâm đẹp trai nhất quả đất không? 🤔<br />
      </h1>
      <input
        type="text"
        id="fake-input"
        placeholder="Nhập câu trả lời..."
        autocomplete="off"
      />
      <br /><br />
      <button id="btn-send" class="btn-pink">Gửi câu trả lời</button>
    </div>

    <div id="final-message">
      <h1>Happy Birthday</h1>
      <div id="heart-wrapper">
        <div id="heart-3d"></div>

        <div id="heart-image">
            //<img src="imgLast.jpg" alt="Phương Anh" />
        </div>
      </div>
    </div>
    <canvas id="canvas"></canvas>
    <canvas id="fireworks-canvas"></canvas>

    <script>
      /* ================= XỬ LÝ ÂM THANH ================= */
      const bgMusic = document.getElementById("bg-music");
      const sfxJump = document.getElementById("sfx-jump");
      bgMusic.volume = 0.6;

      // Hàm này sẽ cố gắng phát nhạc
      function tryPlayMusic() {
        if (bgMusic.paused) {
          bgMusic.play().catch((e) => console.log("Chờ tương tác..."));
        }
      }

      // KỸ THUẬT: Bắt sự kiện chạm/click đầu tiên vào trang web
      // Bất kể người dùng bấm vào đâu lần đầu tiên, nhạc sẽ bật ngay
      document.body.addEventListener("click", tryPlayMusic, { once: true });
      document.body.addEventListener("touchstart", tryPlayMusic, {
        once: true,
      });
      // Thêm cả sự kiện di chuột cho chắc chắn trên PC
      document.body.addEventListener("mousemove", tryPlayMusic, { once: true });

      function playSoundJump() {
        sfxJump.currentTime = 0;
        sfxJump.play().catch((e) => {});
      }

      /* ================= LOGIC FORM ================= */
      const screen1 = document.getElementById("screen-1");
      const screen2 = document.getElementById("screen-2");
      const btnNo = document.getElementById("btn-no");
      const btnYes = document.getElementById("btn-yes");
      const fakeInput = document.getElementById("fake-input");
      const btnSend = document.getElementById("btn-send");

      function moveButton() {
        playSoundJump();

        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;
        const btnRect = btnNo.getBoundingClientRect();

        const padding = 20;
        const maxX = windowWidth - btnRect.width - padding;
        const maxY = windowHeight - btnRect.height - padding;

        const randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
        const randomY = Math.floor(Math.random() * (maxY - padding)) + padding;

        btnNo.style.position = "fixed";
        btnNo.style.left = randomX + "px";
        btnNo.style.top = randomY + "px";
      }

      btnNo.addEventListener("mouseover", moveButton);

      btnNo.addEventListener("touchstart", (e) => {
        e.preventDefault();
        moveButton();
        tryPlayMusic(); // Đảm bảo nhạc chạy khi chạm nút này
      });

      btnYes.addEventListener("click", () => {
        tryPlayMusic(); // Đảm bảo nhạc chạy khi bấm nút này
        screen1.classList.add("hidden");
        screen2.classList.remove("hidden");
        fakeInput.focus();
      });

      const targetText = "Phương Anh thực sự thấy Lâm đẹp trai nhất mòaaaa 🌹";
      fakeInput.addEventListener("input", (e) => {
        const currentLength = e.target.value.length;
        if (currentLength > 0) {
          e.target.value = targetText.substring(0, currentLength);
          if (currentLength > targetText.length) e.target.value = targetText;
        }
      });

      btnSend.addEventListener("click", () => {
        fakeInput.blur();
        screen2.style.opacity = "0";
        setTimeout(() => {
          screen2.classList.add("hidden");
          startAnimation();
          transformShape();
        }, 1000);
      });

      /* ================= LOGIC VŨ TRỤ ================= */
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const msgElement = document.getElementById("final-message");

      let width, height;
      let particles = [];

      const isMobile = window.innerWidth < 768;
      const particleCount = isMobile ? 2300 : 3500;

      let isSphere = false;
      let rotationSpeed = 0.005;

      const treeHeight = isMobile ? 320 : 520;
      const treeBaseRadius = isMobile ? 180 : 280;
      const trunkHeight = isMobile ? 100 : 140;
      const trunkRadius = isMobile ? 60 : 80;
      const sphereRadius = isMobile ? 1860 : 2100;

      const colors = ["#e74c3c", "#2ecc71", "#f1c40f", "#3498db", "#ffffff"];

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      }

      class Particle {
        constructor() {
          this.x = (Math.random() - 0.5) * width;
          this.y = (Math.random() - 0.5) * height;
          this.z = (Math.random() - 0.5) * 500;
          this.tx = 0;
          this.ty = 0;
          this.tz = 0;
          this.size = Math.random() * (isMobile ? 2 : 3) + 2;
          this.color = colors[Math.floor(Math.random() * colors.length)];
          this.setTreeTarget();
        }
        setTreeTarget() {
          const isTrunk = Math.random() < 0.15;
          if (isTrunk) {
            const h = Math.random() * trunkHeight;
            const angle = Math.random() * Math.PI * 2;
            const r = Math.random() * trunkRadius;
            this.tx = Math.cos(angle) * r;
            this.tz = Math.sin(angle) * r;
            this.ty = treeHeight / 2 + h;
            this.color = "#8B4513";
          } else {
            const p = Math.random();
            this.ty = (p - 0.5) * treeHeight;
            const angle = p * Math.PI * 20 + Math.random() * Math.PI * 2;
            const r = p * treeBaseRadius;
            this.tx = Math.cos(angle) * r;
            this.tz = Math.sin(angle) * r;
            if (this.color === "#8B4513")
              this.color = colors[Math.floor(Math.random() * colors.length)];
          }
        }
        setSphereTarget() {
          const u = Math.random();
          const v = Math.random();
          const theta = 2 * Math.PI * u;
          const phi = Math.acos(2 * v - 1);
          this.tx = sphereRadius * Math.sin(phi) * Math.cos(theta);
          this.ty = sphereRadius * Math.sin(phi) * Math.sin(theta);
          this.tz = sphereRadius * Math.cos(phi);
          if (this.color === "#8B4513")
            this.color = colors[Math.floor(Math.random() * colors.length)];
        }
        update() {
          this.x += (this.tx - this.x) * 0.05;
          this.y += (this.ty - this.y) * 0.05;
          this.z += (this.tz - this.z) * 0.05;
        }
      }

      function initParticles() {
        resize();
        particles = [];
        for (let i = 0; i < particleCount; i++) {
          particles.push(new Particle());
        }
      }

      function transformShape() {
        isSphere = true;
        particles.forEach((p) => p.setSphereTarget());
        setTimeout(() => {
          msgElement.classList.add("show-text");
          msgElement.classList.add("heartbeat");
          // createHeartText();
          create3DHeartText();
          animate3DHeart();
          startFireworks();
        }, 800);
      }

      let angle = 0;
      function animate() {
        requestAnimationFrame(animate);
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, width, height);

        angle += rotationSpeed;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const cx = width / 2;
        const cy = height / 2;

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.update();
          let x = p.x * cos - p.z * sin;
          let z = p.x * sin + p.z * cos;
          let y = p.y;

          const cameraZ = isMobile ? 1200 : 1000;
          const scale = 400 / (400 + (z + cameraZ));

          const canvasX = cx + x * scale;
          const canvasY = cy + y * scale;
          if (scale > 0) {
            ctx.beginPath();
            ctx.fillStyle = p.color;
            ctx.arc(canvasX, canvasY, p.size * scale, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function startAnimation() {
        initParticles();
        animate();
        window.addEventListener("resize", resize);
      }
      const heartText = "❤️";
      const heartContainer = document.getElementById("heart-text");

      function createHeartText() {
        heartContainer.innerHTML = "";

        const chars = heartText.split("");
        const total = chars.length;

        chars.forEach((char, i) => {
          const span = document.createElement("span");
          span.className = "heart-char";
          span.innerText = char;

          // Công thức trái tim toán học ❤️
          const t = (Math.PI * 2 * i) / total;

          const x = 16 * Math.pow(Math.sin(t), 3);
          const y =
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t);

          span.style.left = 200 + x * 10 + "px";
          span.style.top = 180 - y * 10 + "px";

          span.style.animationDelay = i * 0.1 + "s";

          heartContainer.appendChild(span);
        });
      }
      const heart3DText = "❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️";
      const heart3D = document.getElementById("heart-3d");

      let heartChars = [];
      let rotateY = 0;
      let rotateX = 15;

      function create3DHeartText() {
        heart3D.innerHTML = "";
        heartChars = [];

        const chars = heart3DText.split("");
        const total = chars.length;

        chars.forEach((char, i) => {
          const span = document.createElement("span");
          span.className = "heart-3d-char";
          span.innerText = char;

          // Công thức trái tim
          const t = (Math.PI * 2 * i) / total;
          const x = 16 * Math.pow(Math.sin(t), 3);
          const y =
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t);

          const z = Math.sin(t) * 40; // tạo chiều sâu 3D
          const scale = 11;
          heartChars.push({
            span,
            x: x * scale,
            y: -y * scale,
            z,
          });

          heart3D.appendChild(span);
        });
      }
      function animate3DHeart() {
        rotateY += 0.25;
        rotateX = 8 + Math.sin(Date.now() * 0.0015) * 6;

        heartChars.forEach((c) => {
          c.span.style.transform = `
      translate(-50%, -50%)
      translate3d(${c.x}px, ${c.y}px, ${c.z}px)
      rotateY(${rotateY}deg)
      rotateX(${rotateX}deg)
    `;
        });

        requestAnimationFrame(animate3DHeart);
      }
      /* ================= LOGIC BẮN PHÁO HOA  ================= */
      const fwCanvas = document.getElementById("fireworks-canvas");
      const fwCtx = fwCanvas.getContext("2d");
      let fwWidth = window.innerWidth;
      let fwHeight = window.innerHeight;

      fwCanvas.width = fwWidth;
      fwCanvas.height = fwHeight;

      class Firework {
        constructor(x, y, targetX, targetY) {
          this.x = x;
          this.y = y;
          this.targetX = targetX;
          this.targetY = targetY;
          this.speed = 3;
          this.angle = Math.atan2(targetY - y, targetX - x);
          this.velocities = {
            x: Math.cos(this.angle) * this.speed,
            y: Math.sin(this.angle) * this.speed,
          };
          this.history = [];
          this.reachedTarget = false;
        }
        update() {
          this.history.push({ x: this.x, y: this.y });
          if (this.history.length > 5) this.history.shift();
          this.x += this.velocities.x;
          this.y += this.velocities.y;

          const dx = this.targetX - this.x;
          const dy = this.targetY - this.y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < this.speed) {
            this.reachedTarget = true;
          }
        }
        draw() {
          fwCtx.beginPath();
          if (this.history.length > 0) {
            fwCtx.moveTo(this.history[0].x, this.history[0].y);
            for (let i = 1; i < this.history.length; i++) {
              fwCtx.lineTo(this.history[i].x, this.history[i].y);
            }
          } else {
            fwCtx.moveTo(this.x, this.y);
          }
          fwCtx.lineTo(this.x, this.y);
          fwCtx.strokeStyle = "#ff69b4";
          fwCtx.stroke();
        }
      }

      class ParticleFW {
        constructor(x, y, color) {
          this.x = x;
          this.y = y;
          this.color = color;
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 3 + 1;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.friction = 0.95;
          this.gravity = 0.05;
          this.alpha = 1;
          this.decay = Math.random() * 0.015 + 0.005;
        }
        update() {
          this.vx *= this.friction;
          this.vy *= this.friction;
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;
          this.alpha -= this.decay;
        }
        draw() {
          fwCtx.save();
          fwCtx.globalAlpha = this.alpha;
          fwCtx.fillStyle = this.color;
          fwCtx.beginPath();
          fwCtx.arc(this.x, this.y, 2, 0, Math.PI * 2);
          fwCtx.fill();
          fwCtx.restore();
        }
      }

      let fireworks = [];
      let particlesFW = [];
      let fireworksActive = false;

      function loopFireworks() {
        if (!fireworksActive) return;
        requestAnimationFrame(loopFireworks);

        // Tạo hiệu ứng vệt mờ (trails)
        fwCtx.globalCompositeOperation = "destination-out";
        fwCtx.fillStyle = "rgba(0, 0, 0, 0.1)"; // Độ mờ của đuôi
        fwCtx.fillRect(0, 0, fwWidth, fwHeight);
        fwCtx.globalCompositeOperation = "lighter";

        // Tạo pháo hoa mới ngẫu nhiên
        if (Math.random() < 0.05) {
          fireworks.push(
            new Firework(
              Math.random() * fwWidth,
              fwHeight,
              Math.random() * fwWidth,
              (Math.random() * fwHeight) / 2
            )
          );
        }

        // Cập nhật pháo bay lên
        for (let i = fireworks.length - 1; i >= 0; i--) {
          fireworks[i].update();
          fireworks[i].draw();
          if (fireworks[i].reachedTarget) {
            createExplosion(fireworks[i].x, fireworks[i].y);
            fireworks.splice(i, 1);
          }
        }

        // Cập nhật vụ nổ
        for (let i = particlesFW.length - 1; i >= 0; i--) {
          particlesFW[i].update();
          particlesFW[i].draw();
          if (particlesFW[i].alpha <= 0) particlesFW.splice(i, 1);
        }
      }

      function createExplosion(x, y) {
        const colors = ["#ff0040", "#ff00ff", "#00ffff", "#ffff00", "#ff69b4"];
        const color = colors[Math.floor(Math.random() * colors.length)];
        for (let i = 0; i < 50; i++) {
          particlesFW.push(new ParticleFW(x, y, color));
        }
      }

      function startFireworks() {
        fireworksActive = true;
        loopFireworks();
      }

      resize();
    </script>
  </body>
</html>
